name: Build HyperOS Taskbar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HyperOSTaskbar/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: HyperOSTaskbar
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Taskbar-debug
          path: HyperOSTaskbar/app/build/outputs/apk/debug/app-debug.apk
