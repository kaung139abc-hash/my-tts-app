name: Build 3D Live Wallpaper APK

on:
  push:
    paths:
      - "3DLiveWallpaper/**"
      - ".github/workflows/build-3d-wallpaper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3DLiveWallpaper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3DLiveWallpaper-debug
          path: 3DLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
