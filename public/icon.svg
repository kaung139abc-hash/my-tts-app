      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#inner)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#bg)" stroke-width="8" stroke-opacity="0.3"/>
  <g transform="translate(136, 116)" fill="none" stroke="url(#bg)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Microphone body -->
    <rect x="70" y="20" width="100" height="170" rx="50" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M70 100 A50 50 0 0 0 170 100 V40 A50 50 0 0 0 70 40 Z" fill="#f59e0b"/>
